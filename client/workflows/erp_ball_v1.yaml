# ERP 全景球场的球定位工作流。由 client/workflow.py 当作**固定状态机**执行：
# 模型只回答「哪个格子」，走哪一步全由本地的 when 条件判断。
#
# 每一级的几何参数与实测精度（scripts/smoke_vlm.py 在 260122__002__1703_1713 上
# 打的 8 帧 × 4 家，中位误差 / <20px 命中率）：
#
#   L0 montage 1024宽 8x4     505 px/格   540–1440 px    0%   ← 全军覆没，已停用
#   L1 crop 480 x2   6x6       80 px/格    32–150 px    38%   ← 只在没有先验时兜底
#   P1 crop 200 x5   8x8       25 px/格   （外推入口）
#   L2 crop  80 x8   8x8       10 px/格     5.6–9.9 px  88%
#   L3 crop  27 x20  9x9        3 px/格     2.7–6.0 px 100%
#
# 结论直接写进了流程形状：**能拿到先验就从 P1/L2 起跑**，L0 那条路不走。

name: erp_ball_v1
version: 2

defaults:
  model: primary
  max_calls_per_frame: 5
  # 低于这个置信度就当作「这一帧没标出来」，交给 track.py 插值。
  # 宁可放弃也不要留一个错点：错点会污染外推，把后面十几帧一起带偏。
  accept_conf: 0.35
  # 细化级只有落在上一级答案的 1.2 个格宽 + 4 px 之内才被采纳，否则相信更粗但更稳
  # 的那一级。这个值是扫出来的（0.6 / 1.2 / 2.0 / 4.0 四档，中位误差
  # 27.2 / 9.9 / 13.9 / 16.9 px）：太松放进去的是「细化级换了个目标」，
  # 太紧把真正的小修正也挡掉，反而让轨迹发散。
  chain_tol_cells: 1.2
  chain_tol_px: 4

stages:

  # ---- 冷启动：没有先验的时候才走 ----------------------------------------

  # 本地 DoG blob 候选。实测在「球贴着球员脚下」的包里召回很低（top-8 约 8%），
  # 所以它不是主力，只是给 refine1 一个比 ROI 中心强的起点。
  - id: propose
    kind: local_propose
    when: "not has_prior"
    top_k: 8
    radius: 420

  # 480 px 窗、2× Lanczos、原图与滤波图并排。命中率只有 38%，但没有先验时
  # 这是唯一能覆盖足够大范围的一级。
  - id: refine1
    kind: vlm_grid
    when: "not has_prior"
    view:
      type: crop
      center: "propose or roi_center"
      size: 480
      upscale: 2
      resample: lanczos
      panes: [raw, enh]
    grid: {cols: 6, rows: 6}
    prompt: refine
    model: primary

  # ---- 主路径：有先验就从这里起跑 ----------------------------------------

  # 外推入口。step=3 时快球两帧间约跑 390 px，但线性外推的残差远小于此；
  # 200 px 的窗配 8×8 网格 = 25 px/格，正好把中心交给 L2 时落进它的量程。
  # 外推够准（不确定半径已经落进 refine2 的 80 px 窗口）时整级跳过，
  # 直接从 refine2 起跑。这一条把稳定跟踪时的单帧调用数从 3 降到 2。
  - id: predict1
    kind: vlm_grid
    when: "has_prior and prior_r > 30"
    view:
      type: crop
      center: predict
      size: 200
      upscale: 5
      resample: nearest
      panes: [raw, enh]
    grid: {cols: 8, rows: 8}
    prompt: refine
    model: primary

  # 主力级。8× 最近邻放大——要的是让模型看见像素块，和人把图放大到 800%
  # 之后看到的一模一样，插值反而会把 3 px 的球糊成一团灰。
  # `has_prior` 这一项不能少：外推够准时 predict1 整级跳过，如果 when 只写
  # `predict1.ok`，主力级会跟着一起被跳掉，整条链退化成「拿外推点直接进 refine3」。
  # 这个 bug 是标定跑出来的——中位误差从 8 px 掉到 19 px，肉眼看单帧结果看不出来。
  - id: refine2
    kind: vlm_grid
    when: "predict1.ok or refine1.ok or propose.ok or has_prior"
    view:
      type: crop
      center: "predict1 or refine1 or propose or predict"
      size: 80
      upscale: 8
      resample: nearest
      panes: [raw, enh]
    grid: {cols: 8, rows: 8}
    prompt: refine
    model: primary

  # 拖影兜底：refine2 没把握而且球在快速移动时，改看时间最大投影。
  # 实测这一级本身不准（中位 40 px），所以它的作用是**给 refine3 一个中心**，
  # 而不是直接采纳；置信度天然低，accept_conf 会把它挡在采纳之外。
  # refine2 明说「局部图和参考图里都没有球」时不再往下钻：那是整块区域就没球，
  # 换个视图也变不出来，直接把这一帧交给插值。
  - id: streak
    kind: vlm_grid
    when: "refine2.conf < 0.4 and motion_px > 30 and not refine2.no_ball"
    view:
      type: crop
      center: "predict1 or predict"
      size: 240
      upscale: 4
      resample: nearest
      panes: [enh_maxproj, enh]
      maxproj_span: 2
    grid: {cols: 6, rows: 6}
    prompt: streak
    model: fallback

  # 收尾。整条链的精度就是在这一级挣到的。
  #
  # 计划里写的是 27 px 窗 / 9×9。单级测出来它确实最准（中位 2.7 px、100% 落进
  # 20 px），但那是**中心几乎没有误差**时的成绩；接到 refine2 后面实测有 59% 的帧
  # 返回 null——refine2 的中位误差 8.6 px，27 px 的窗只有 ±13.5 px 余量，球经常
  # 根本不在窗里。这时模型答 null 是**对的**（提示词就是这么要求的），错的是窗口。
  # 放宽到 45 px 后余量翻倍，每格仍只有 5 px，比 refine2 的 10 px/格 精一倍。
  - id: refine3
    kind: vlm_grid
    when: "refine2.ok or streak.ok"
    view:
      type: crop
      center: "refine2 or streak"
      size: 45
      upscale: 16
      resample: nearest
      panes: [raw, enh]
    grid: {cols: 9, rows: 9}
    prompt: refine
    model: primary
    # 两个视图各问一次：原图+滤波图一起看、只看滤波图。答案对得上就互相背书，
    # 对不上说明这块图本身有歧义，置信度按分歧幅度打折。
    # 只在 refine2 本身没把握时才投票——refine2 高置信的帧占绝大多数，
    # 对它们再打一次的收益远小于把整包耗时翻倍的代价。
    vote:
      n: 2
      views: [both, enh_only]
      tol_px: 6
      when: "refine2.conf < 0.8"

  # 离群剔除 + 插值 + 平滑，由 client/track.py 承接，不占模型调用。
  - id: postprocess
    kind: local
