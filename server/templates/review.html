<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>审核队列 · 足球 GT</title>
<style>
  :root { --bg:#14161a; --panel:#1d2027; --line:#2c313b; --fg:#e6e8ec; --dim:#8b93a1;
          --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --acc:#60a5fa; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg);
              font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #top { display:flex; align-items:center; gap:10px; padding:7px 12px;
         background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #top .grow { flex:1; }
  a.btn, button { background:transparent; color:var(--fg); border:1px solid var(--line);
                  border-radius:6px; padding:5px 11px; font-size:13px; cursor:pointer;
                  text-decoration:none; white-space:nowrap; }
  button:hover, a.btn:hover { filter:brightness(1.25); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.on { background:var(--acc); color:#0b1220; border-color:var(--acc); font-weight:600; }
  input { background:#0f1115; border:1px solid var(--line); color:var(--fg);
          border-radius:6px; padding:5px 8px; font-size:13px; font-family:inherit; width:120px; }
  /* 密码管理器常把「名字」输入框刷成黄底用户名；盖掉自动填充样式 */
  #reviewer:-webkit-autofill, #reviewer:-webkit-autofill:hover, #reviewer:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--fg);
    box-shadow: 0 0 0 1000px #0f1115 inset;
    transition: background-color 99999s ease-out;
  }
  .wrap { max-width:1240px; width:100%; margin:0 auto; padding:22px 20px 60px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); margin-bottom:18px; line-height:1.8; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  tr.q { cursor:pointer; }
  tr.q:hover td { background:#232733; }
  td.mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  td.dim { color:var(--dim); font-size:12px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:20px; border:1px solid var(--line);
         color:var(--warn); margin-right:4px; display:inline-block; }
  .sitenav { display:flex; gap:2px; padding:0 8px; background:#101216;
             border-bottom:1px solid var(--line); }
  .sitenav a { color:var(--dim); text-decoration:none; padding:9px 16px; font-size:13px;
               border-bottom:2px solid transparent; }
  .sitenav a:hover { color:var(--fg); }
  .sitenav a.on { color:var(--fg); border-bottom-color:var(--acc); font-weight:600; }
</style>
</head>
<body>

<nav class="sitenav" id="sitenav">
  <a href="/#produce">数据包生产</a>
  <a href="/#manage">数据包管理</a>
  <a href="/review" class="on">数据包审核</a>
</nav>
<div id="top">
  <b>审核队列</b>
  <span class="grow"></span>
  <span style="color:var(--dim);font-size:12px">审核员</span>
  <!-- 绝不能 autocomplete=username：密码管理器会当登录框，每次刷新把记住的名字盖掉 -->
  <input id="reviewer" name="ball_gt_reviewer" placeholder="你的名字"
         autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
         data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other">
</div>

<div class="wrap">
  <h1>审核队列</h1>
  <div class="sub">
    待审是还没进 GT 的 AI 提交；已入库（含人工）也可以再打开重审。审核在工作台里做，四种结果：<br>
    <b style="color:var(--ok)">通过</b> 整包入库 ·
    <b style="color:var(--warn)">部分人工修复</b> 标错误帧，其余入库，错误帧进修复，修完直接入库 ·
    <b style="color:var(--bad)">重标</b> 回待领取池，同一 harness+模型（或同一标注员）不能再领 ·
    <b style="color:var(--bad)">移除</b> 数据本身有问题，不再标注也不再生产，可顺带停用整路视频
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span>
        <button id="qTabPending" class="on">待审</button>
        <button id="qTabAccepted">已入库</button>
      </span>
      <span>
        <b id="qCount">加载中…</b>
        <button id="qFirst">审第一条 (Enter)</button>
        <button id="qRefresh">刷新</button>
      </span>
    </div>
    <table id="qTable" style="margin-top:10px"><tbody></tbody></table>
  </div>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const REVIEWER_KEY = 'ball_gt_reviewer';

async function jget(u) {
  const r = await fetch(u);
  const d = await r.json().catch(() => ({ error: '返回不是 JSON' }));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function fmtDay(v) {
  if (v === null || v === undefined || v === '') return '—';
  const d = typeof v === 'number' ? new Date(v * 1000) : new Date(String(v));
  if (Number.isNaN(d.getTime())) return esc(v);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function bindReviewer() {
  const input = $('#reviewer');
  input.value = (localStorage.getItem(REVIEWER_KEY) || '').trim();
  input.addEventListener('change', () => {
    const v = input.value.trim();
    if (v) localStorage.setItem(REVIEWER_KEY, v);
    else localStorage.removeItem(REVIEWER_KEY);
  });
  input.addEventListener('keydown', (e) => { if (e.code === 'Enter') input.blur(); });
}

function queueTab() {
  return new URLSearchParams(location.search).get('tab') === 'accepted' ? 'accepted' : 'pending';
}
function setQueueTab(tab) {
  const want = tab === 'accepted' ? 'accepted' : 'pending';
  const url = want === 'accepted' ? '/review?tab=accepted' : '/review';
  if (location.pathname + location.search !== url) history.replaceState(null, '', url);
  $('#qTabPending').classList.toggle('on', want === 'pending');
  $('#qTabAccepted').classList.toggle('on', want === 'accepted');
  return want;
}

function methodText(r) {
  if (r.method_tag) return esc(r.method_tag);
  const legacy = [r.model_used, r.workflow].filter(Boolean).join(' · ');
  return legacy ? `${esc(legacy)} <span class="tag">旧记录</span>` : esc(r.worker || '—');
}

async function loadQueue() {
  const tab = setQueueTab(queueTab());
  const q = tab === 'accepted'
    ? '/api/v2/submissions?state=accepted&source=all&limit=500'
    : '/api/v2/submissions?state=pending&source=all';
  try {
    const d = await jget(q);
    const rows = d.submissions || [];
    $('#qCount').textContent = rows.length
      ? (tab === 'accepted' ? `${rows.length} 条已入库` : `${rows.length} 条待审`)
      : (tab === 'accepted' ? '没有已入库的提交' : '队列是空的');
    $('#qFirst').disabled = !rows.length;
    const head = '<tr><th>submission</th><th>packet</th><th>生产</th><th>来源</th>'
               + '<th>标注方法（harness · 模型 · 日期）</th><th>覆盖</th><th>均值置信</th>'
               + '<th>插值</th><th>QC</th><th></th></tr>';
    const empty = tab === 'accepted' ? '没有已入库的提交' : '没有待审的提交';
    $('#qTable tbody').innerHTML = head + (rows.map((r) => {
      const cov = r.coverage === null || r.coverage === undefined
        ? '—' : Math.round(r.coverage * 100) + '%';
      const mc = r.mean_conf === null || r.mean_conf === undefined ? '—' : r.mean_conf.toFixed(2);
      const mcCls = (r.mean_conf !== null && r.mean_conf !== undefined && r.mean_conf < 0.6) ? 'style="color:var(--bad)"' : '';
      const src = r.source === 'human' ? '人工' : (r.source === 'ai' ? 'AI' : (r.source || '—'));
      const tags = (r.qc_flags || []).map((f) => `<span class="tag">${esc(f)}</span>`).join('')
                 + (r.has_bundle ? '' : '<span class="tag">无审核包</span>');
      return `<tr class="q" data-id="${r.submission_id}">
        <td class="mono">#${r.submission_id}</td>
        <td class="mono">${esc(r.packet_id)}</td>
        <td class="dim">${fmtDay(r.produced_at)}</td>
        <td>${src}</td>
        <td>${methodText(r)}</td>
        <td>${r.n_labeled}/${r.n_targets}（${cov}）</td>
        <td ${mcCls}>${mc}</td>
        <td>${r.n_interp || 0}</td>
        <td>${tags || '—'}</td>
        <td style="text-align:right"><button>${tab === 'accepted' ? '再审' : '审核'}</button></td></tr>`;
    }).join('') || `<tr><td style="color:var(--dim)">${empty}</td></tr>`);
    $('#qTable').querySelectorAll('tr.q').forEach((tr) => {
      tr.onclick = () => { location.href = '/review/' + tr.dataset.id; };
    });
    $('#qFirst').onclick = () => { if (rows.length) location.href = '/review/' + rows[0].submission_id; };
  } catch (e) {
    $('#qCount').innerHTML = `<span style="color:var(--bad)">队列加载失败：${esc(e.message)}</span>`;
  }
}

(async function main() {
  bindReviewer();
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'Enter') { e.preventDefault(); $('#qFirst').click(); }
  });
  try {
    const w = await jget('/api/whoami');
    if (w.mode === 'manual') {
      $('#sitenav').innerHTML = '<a href="/?tab=label">待标注</a><a href="/?tab=review" class="on">待审核</a><a href="/?tab=repair">待修复</a>';
    }
  } catch (e) { /* 公网站也有 whoami */ }
  $('#qTabPending').onclick = () => { setQueueTab('pending'); loadQueue(); };
  $('#qTabAccepted').onclick = () => { setQueueTab('accepted'); loadQueue(); };
  $('#qRefresh').onclick = loadQueue;
  loadQueue();
})();
</script>
</body>
</html>
