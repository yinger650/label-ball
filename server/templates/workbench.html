<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工作台 · 足球 GT</title>
<style>
  :root { --bg:#14161a; --panel:#1d2027; --line:#2c313b; --fg:#e6e8ec; --dim:#8b93a1;
          --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --acc:#60a5fa; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
              overflow:hidden; display:flex; flex-direction:column; }
  body { user-select:none; }
  #top { display:flex; align-items:center; gap:10px; padding:7px 12px; flex:none;
         background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
         position:relative; z-index:20; }
  #top .pid { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); }
  #top .grow { flex:1; }
  .pill { padding:3px 10px; border:1px solid var(--line); border-radius:20px;
          font-size:12px; color:var(--dim); white-space:nowrap; }
  .pill.on { background:var(--acc); color:#0b1220; border-color:var(--acc); font-weight:600; }
  .pill.ok { color:var(--ok); border-color:#2f4a39; }
  .pill.warn { color:var(--warn); border-color:#4a3f22; }
  .pill.bad { color:var(--bad); border-color:#4a2a2a; }
  a.btn, button { background:transparent; color:var(--fg); border:1px solid var(--line);
                  border-radius:6px; padding:5px 11px; font-size:13px; cursor:pointer;
                  text-decoration:none; white-space:nowrap; }
  button:hover, a.btn:hover { filter:brightness(1.25); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:var(--acc); color:#0b1220; border-color:var(--acc); font-weight:600; }
  button.good { border-color:#2f4a39; color:var(--ok); }
  button.bad { border-color:#4a2a2a; color:var(--bad); }
  button.on { background:var(--acc); color:#0b1220; border-color:var(--acc); font-weight:600; }
  #warnbar { flex:none; display:none; padding:5px 12px; font-size:12px;
             background:#3a2c14; color:var(--warn); border-bottom:1px solid var(--line); }
  #enhbar { flex:none; display:none; padding:5px 12px; font-size:12px;
            background:#1a2430; color:var(--acc); border-bottom:1px solid var(--line); }
  #enhbar.on { display:block; }
  #main { flex:1; min-height:0; display:flex; }
  #left { flex:1; min-width:0; display:flex; flex-direction:column; }
  #stage { flex:1; min-height:200px; display:flex; justify-content:center; align-items:center;
           background:#0a0b0e; overflow:hidden; }
  #overview { display:block; flex:none; background:#000; cursor:crosshair; }
  #player { display:block; width:256px; height:256px; background:#000; cursor:crosshair; }
  #tablewrap { flex:1; min-height:0; overflow:auto; display:none; padding:0 4px; }
  #stripwrap { flex:none; padding:6px 10px 2px; background:var(--panel);
               border-top:1px solid var(--line); }
  #strip { display:block; width:100%; cursor:pointer; }
  #rangeHint { font-size:11px; color:var(--dim); margin:2px 0 0; min-height:16px; }
  #transport { flex:none; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
               padding:6px 10px 8px; background:var(--panel); border-top:1px solid var(--line); }
  #side { flex:none; width:280px; border-left:1px solid var(--line); background:var(--panel);
          overflow-y:auto; padding:10px 12px 40px; }
  #side h3 { font-size:12px; color:var(--dim); font-weight:500; margin:14px 0 6px; }
  #side h3:first-child { margin-top:0; }
  #zoom { width:256px; height:256px; margin:0 auto; background:#000;
          border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  #chart { display:block; width:100%; background:#0f1115;
           border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .kv { display:grid; grid-template-columns:82px 1fr; gap:2px 8px; font-size:12px; }
  .kv b { color:var(--dim); font-weight:400; }
  .kv span { font-family:ui-monospace,Menlo,monospace; }
  kbd { background:#000; border:1px solid var(--line); border-radius:4px;
        padding:0 5px; font-family:ui-monospace,Menlo,monospace; color:var(--fg); }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--dim); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; }
  #toast { flex:none; position:static; left:auto; right:auto; top:auto; transform:none;
           z-index:10; background:#1a2430; border:none; border-bottom:1px solid var(--line);
           border-radius:0; padding:8px 12px; display:none; align-items:center;
           justify-content:center; gap:12px; width:100%; max-width:none; }
</style>
</head>
<body>
<div id="top">
  <span class="pid" id="pid">工作台</span>
  <span class="pill" id="modePill"></span>
  <span class="pill" id="srcPill"></span>
  <span class="pill" id="progress"></span>
  <span class="grow"></span>
  <button id="bInvisible">本帧不可见 X</button>
  <button id="bClear">清除 U</button>
  <button id="bRangeClear">本段清除标注</button>
  <button id="bRangeInvis">本段不可见</button>
  <button class="primary" id="bSubmit">提交</button>
  <button class="bad" id="bAbandon">抛弃本包</button>
  <a class="btn" href="/">列表</a>
</div>
<div id="enhbar"></div>
<div id="warnbar"></div>
<div id="toast"></div>
<div id="main">
  <div id="left">
    <div id="stage"><canvas id="overview"></canvas></div>
    <div id="tablewrap"><table><tbody id="tbody"></tbody></table></div>
    <div id="stripwrap">
      <canvas id="strip"></canvas>
      <div id="rangeHint"></div>
    </div>
    <div id="transport">
      <button id="bPlay" style="width:74px">播放 ␣</button>
      <button id="bPrev">, 退</button>
      <button id="bNext">. 进</button>
      <span class="pill" id="pFps">12 fps</span>
      <button id="bSlower">−</button>
      <button id="bFaster">=</button>
      <button id="bPane">滤波图 W</button>
      <button id="bMode">固定区域 F</button>
      <button id="bLoop" class="on">循环</button>
      <button id="bPing">摆动</button>
      <button id="bIn">标记头 [</button>
      <button id="bOut">标记尾 ]</button>
      <button id="bClrRange">全段 \</button>
      <button id="bSus">可疑 J/K</button>
      <span class="grow" style="flex:1"></span>
      <button id="bDownload">下载到本地以便修正</button>
    </div>
  </div>
  <div id="side">
    <h3>局部放大（点选修正）</h3>
    <div id="zoom"><canvas id="player" width="256" height="256"></canvas></div>
    <h3>Scan 总览（点图跳帧）</h3>
    <canvas id="scan" style="width:100%;background:#0b0d11;border:1px solid var(--line);border-radius:6px;cursor:crosshair"></canvas>
    <h3>pano_x / pano_y 随帧号变化</h3>
    <canvas id="chart" height="180"></canvas>
    <h3>当前帧</h3>
    <div class="kv" id="kv"></div>
    <h3>色条图例</h3>
    <div class="legend">
      <span><i style="background:#4ade80"></i>已标</span>
      <span><i style="background:#fbbf24"></i>将插值 / 插值</span>
      <span><i style="background:#3d4450"></i>未标</span>
      <span><i style="background:#5b6270"></i>不可见</span>
      <span><i style="background:#0f1115;border:1px solid #f87171"></i>已打回</span>
    </div>
    <h3>键位</h3>
    <div style="font-size:12px;color:var(--dim);line-height:2">
      局部窗左键点球心修正 · 右键拖 · 滚轮缩放 · 点 Scan 跳帧<br>
      <kbd>空格</kbd> 播放 · <kbd>,</kbd><kbd>.</kbd> 拨帧 · <kbd>W</kbd> 原图/滤波<br>
      <kbd>X</kbd> 不可见 · <kbd>U</kbd> 清除 · <kbd>S</kbd> 提交<br>
      <kbd>[</kbd><kbd>]</kbd> 只圈选范围（不记点）· <kbd>D</kbd> 本段清除红叉和旧点<br>
      球不动：在画面上点头尾两帧球心，全图会画出插值轨迹，再提交看审核回放<br>
      预选框默认跟上帧。没有球：本段不可见再提交。质量不行才抛弃。
    </div>
  </div>
</div>
<script src="/static/js/gtplayer.js?v=20260916scan"></script>
<script src="/static/js/workbench.js?v=20260914e"></script>
</body>
</html>
