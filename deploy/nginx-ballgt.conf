# 放到标注站 nginx vhost。证书路径按机器实际情况改。
server {
    listen 80;
    server_name ballgt.yinger650.com;
    client_max_body_size 220m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/panel_ssl;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ballgt.yinger650.com;
    client_max_body_size 220m;

    ssl_certificate     /www/server/panel/vhost/cert/ballgt.yinger650.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ballgt.yinger650.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
